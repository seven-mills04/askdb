name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  demo-database:
    name: Demo database (seed script)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: askdb
          POSTGRES_PASSWORD: askdb
          POSTGRES_DB: askdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U askdb" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGPASSWORD: askdb
    steps:
      - uses: actions/checkout@v4
      - name: Run the seed script
        run: psql -h localhost -U askdb -d askdb -v ON_ERROR_STOP=1 -q -f db/init/01-tunebase-demo.sql
      - name: Demo login can read but not write
        run: |
          export PGPASSWORD=demo_readonly
          test "$(psql -h localhost -U askdb_demo -d tunebase -At -c 'SELECT COUNT(*) FROM artists')" = "60"
          ! psql -h localhost -U askdb_demo -d tunebase -c 'DELETE FROM artists'
