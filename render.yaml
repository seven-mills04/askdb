# Render Blueprint: Render reads this file and creates the backend and its database.
# In Render: New → Blueprint → pick this repository → Apply.
#
# Free plan, so: the backend sleeps after 15 idle minutes and takes about a minute to wake,
# and the free database expires 30 days after it is created (Render emails before that).

services:
  - type: web
    name: askdb-api
    runtime: docker
    plan: free
    region: singapore            # closest Render region to India
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit    # every push to main redeploys
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: askdb-db
          property: connectionString
      # Secrets Render generates once and keeps. Never commit real values.
      - key: ASKDB_JWT_SECRET
        generateValue: true
      - key: ASKDB_ENCRYPTION_SECRET
        generateValue: true
      - key: ASKDB_DEMO_PASSWORD
        generateValue: true
      # The demo data goes inside the app database (the free plan allows one database).
      - key: ASKDB_DEMO_SEED
        value: "true"
      # A public server must not let users point it at its own private network.
      - key: ASKDB_BLOCK_PRIVATE_HOSTS
        value: "true"
      # The Vercel site (and its preview links) may call this API.
      - key: ASKDB_CORS_ORIGINS
        value: https://askdb*.vercel.app,http://localhost:5173
      # Render asks for this one when you apply the Blueprint: paste the Groq key.
      - key: ASKDB_AI_API_KEY
        sync: false

databases:
  - name: askdb-db
    plan: free
    region: singapore
    databaseName: askdb
    user: askdb
    ipAllowList: []              # reachable only from Render's private network, not the internet
