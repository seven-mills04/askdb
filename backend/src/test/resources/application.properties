# Tests use an in-memory H2 database for AskDB's own data, so they need no setup.
spring.datasource.url=jdbc:h2:mem:askdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

askdb.jwt.secret=test-jwt-secret-test-jwt-secret-0123456789
askdb.jwt.expiry-minutes=60
askdb.encryption-secret=test-encryption-secret
askdb.query.max-rows=500
askdb.query.timeout-seconds=5
askdb.cors-origins=http://localhost:5173
askdb.block-private-hosts=false
askdb.demo.enabled=true
askdb.demo.name=Tunebase (demo)
askdb.demo.type=POSTGRES
askdb.demo.host=localhost
askdb.demo.port=5432
askdb.demo.database=tunebase
askdb.demo.username=askdb_demo
askdb.demo.password=demo_readonly
askdb.ai.base-url=http://localhost:9/v1
askdb.ai.api-key=
askdb.ai.model=test-model
askdb.ai.timeout-seconds=5
askdb.ai.summaries=true
askdb.ai.requests-per-minute=15
