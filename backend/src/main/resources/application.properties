spring.application.name=askdb
server.port=${PORT:8080}

# --- AskDB's own data (users, saved connections) lives in PostgreSQL ---
spring.datasource.url=${ASKDB_DB_URL:jdbc:postgresql://localhost:5432/askdb}
spring.datasource.username=${ASKDB_DB_USER:askdb}
spring.datasource.password=${ASKDB_DB_PASSWORD:askdb}
# Small pool: free database plans allow few connections.
spring.datasource.hikari.maximum-pool-size=${ASKDB_DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Secrets: the defaults are for local development only. Set real values in production. ---
askdb.jwt.secret=${ASKDB_JWT_SECRET:local-dev-jwt-secret-change-me-0123456789}
askdb.jwt.expiry-minutes=${ASKDB_JWT_EXPIRY_MINUTES:720}
askdb.encryption-secret=${ASKDB_ENCRYPTION_SECRET:local-dev-encryption-secret-change-me}

# --- Limits for every query run against a user's database ---
askdb.query.max-rows=${ASKDB_MAX_ROWS:500}
askdb.query.timeout-seconds=${ASKDB_QUERY_TIMEOUT_SECONDS:5}

# Browsers allowed to call the API (comma separated; * works as a wildcard, e.g. https://askdb*.vercel.app)
askdb.cors-origins=${ASKDB_CORS_ORIGINS:http://localhost:5173}

# Block connections to localhost / private network addresses (turn on in production)
askdb.block-private-hosts=${ASKDB_BLOCK_PRIVATE_HOSTS:false}

# --- Built-in demo database every user can query without connecting anything ---
askdb.demo.enabled=${ASKDB_DEMO_ENABLED:true}
askdb.demo.name=Tunebase (demo)
askdb.demo.type=${ASKDB_DEMO_TYPE:POSTGRES}
askdb.demo.host=${ASKDB_DEMO_HOST:localhost}
askdb.demo.port=${ASKDB_DEMO_PORT:5432}
askdb.demo.database=${ASKDB_DEMO_DATABASE:tunebase}
askdb.demo.username=${ASKDB_DEMO_USER:askdb_demo}
askdb.demo.password=${ASKDB_DEMO_PASSWORD:demo_readonly}
# true = build the demo inside AskDB's own database on startup (for hosts with one database, like Render)
askdb.demo.seed=${ASKDB_DEMO_SEED:false}

# --- AI (plain-English questions). Leave the key empty to run without AI; SQL mode still works. ---
# Free key: https://console.groq.com  . Any OpenAI-compatible provider works by changing base-url and model.
askdb.ai.base-url=${ASKDB_AI_BASE_URL:https://api.groq.com/openai/v1}
askdb.ai.api-key=${ASKDB_AI_API_KEY:}
askdb.ai.model=${ASKDB_AI_MODEL:openai/gpt-oss-120b}
askdb.ai.timeout-seconds=${ASKDB_AI_TIMEOUT_SECONDS:30}
# Summaries send the first rows of a result to the AI service to write a one-line answer.
askdb.ai.summaries=${ASKDB_AI_SUMMARIES:true}
# Questions each user may ask per minute
askdb.ai.requests-per-minute=${ASKDB_AI_REQUESTS_PER_MINUTE:15}
